<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Play Studio Spine · 动画预览工具</title>
  <style>
    :root{--bg:#0a0b0d;--panel:#121417;--panel2:#181b1f;--line:#292d33;--muted:#858b95;--text:#f4f5f7;--accent:#d8ff45;--accent2:#b8dc2f;--danger:#ff6b6b;--stage:#16191d;--radius:14px}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit}.app{height:100%;display:grid;grid-template-rows:58px 1fr}.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);background:#0d0f11;z-index:3}.brand{display:flex;align-items:center;gap:11px}.mark{width:29px;height:29px;border-radius:9px;background:var(--accent);color:#0c0d0d;display:grid;place-items:center;font-weight:900;transform:rotate(-4deg)}.brand strong{font-size:15px;letter-spacing:.2px}.brand small{color:var(--muted);margin-left:7px;font-weight:500}.top-actions{display:flex;gap:9px;align-items:center}
    .btn{border:1px solid var(--line);color:var(--text);background:var(--panel2);height:34px;border-radius:9px;padding:0 13px;cursor:pointer;transition:.18s}.btn:hover{border-color:#444a53;background:#20242a}.btn.primary{background:var(--accent);border-color:var(--accent);color:#10120b;font-weight:700}.btn.primary:hover{background:#e2ff72}.btn:disabled{opacity:.45;cursor:not-allowed}.layout{min-height:0;display:grid;grid-template-columns:265px 1fr 286px}
    .sidebar{min-width:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}.rightbar{border-left:1px solid var(--line);border-right:0}.section{padding:18px;border-bottom:1px solid var(--line)}.section-title{display:flex;justify-content:space-between;align-items:center;color:#d9dce1;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}.count{color:var(--muted);font-variant-numeric:tabular-nums}.hint{font-size:12px;color:var(--muted)}
    .dropzone{display:block;position:relative;width:100%;overflow:hidden;border:1px dashed #3a4048;border-radius:12px;background:#16191c;padding:17px;text-align:center;cursor:pointer;transition:.2s}.dropzone:hover,.dropzone.drag{border-color:var(--accent);background:#191d19}.drop-icon{width:36px;height:36px;margin:0 auto 8px;border-radius:11px;background:#24292e;color:var(--accent);display:grid;place-items:center;font-size:20px}.dropzone b{display:block;font-size:13px;margin-bottom:3px}.dropzone input{position:absolute;inset:0;z-index:2;opacity:0;cursor:pointer;width:100%;height:100%}
    .file-info{display:none;margin-top:12px;padding:10px;border-radius:10px;background:#1c2024}.file-info.show{display:block}.file-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:650;font-size:12px}.file-meta{margin-top:4px;color:var(--muted);font-size:11px}.select{width:100%;height:35px;border:1px solid var(--line);border-radius:8px;color:var(--text);background:#1a1e22;padding:0 9px;outline:none}.field{margin:12px 0}.label{display:flex;justify-content:space-between;margin-bottom:7px;color:#afb4bc;font-size:12px}.label output{color:var(--text);font-variant-numeric:tabular-nums}.animations{min-height:0;flex:1;padding:8px;overflow:auto}.anim-empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12px;padding:30px}.anim-btn{width:100%;display:flex;align-items:center;gap:9px;border:0;background:transparent;color:#c6cad0;padding:9px 10px;border-radius:8px;text-align:left;cursor:pointer}.anim-btn:hover{background:#1c2024;color:#fff}.anim-btn.active{background:#252b25;color:var(--accent)}.play-dot{width:19px;height:19px;border-radius:6px;border:1px solid #3a4047;display:grid;place-items:center;font-size:8px;flex:0 0 auto}.anim-btn.active .play-dot{border-color:var(--accent);background:var(--accent);color:#111}.anim-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .stage-wrap{min-width:0;min-height:0;position:relative;overflow:hidden;touch-action:none;background-color:var(--stage);background-image:linear-gradient(45deg,#1b1e22 25%,transparent 25%),linear-gradient(-45deg,#1b1e22 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#1b1e22 75%),linear-gradient(-45deg,transparent 75%,#1b1e22 75%);background-size:28px 28px;background-position:0 0,0 14px,14px -14px,-14px 0}.stage-wrap.view-ready{cursor:grab}.stage-wrap.panning{cursor:grabbing}.player-host{position:absolute;inset:0;transform-origin:center center;will-change:transform}.player-host>div{width:100%!important;height:100%!important}.empty-stage{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.empty-card{text-align:center;max-width:400px;padding:30px}.empty-symbol{width:64px;height:64px;margin:0 auto 18px;border:1px solid #394047;border-radius:19px;display:grid;place-items:center;color:var(--accent);font-size:25px;box-shadow:0 0 0 8px rgba(216,255,69,.025)}.empty-card h2{font-size:21px;margin:0 0 8px}.empty-card p{color:var(--muted);margin:0}.stage-badge{position:absolute;top:14px;left:14px;display:flex;gap:7px;z-index:2}.pill{padding:5px 8px;border:1px solid rgba(255,255,255,.1);background:rgba(9,10,12,.7);backdrop-filter:blur(8px);border-radius:7px;font-size:11px;color:#adb2ba}.pill.ok{color:var(--accent)}.view-tools{position:absolute;left:50%;bottom:18px;z-index:4;transform:translateX(-50%);display:flex;align-items:center;gap:4px;height:40px;padding:4px;background:rgba(12,14,16,.86);border:1px solid rgba(255,255,255,.11);border-radius:11px;box-shadow:0 9px 30px #0007;backdrop-filter:blur(10px);cursor:default}.view-btn{height:30px;min-width:32px;padding:0 9px;border:0;border-radius:7px;background:transparent;color:#dfe2e6;cursor:pointer}.view-btn:hover:not(:disabled){background:#292e33;color:var(--accent)}.view-btn:disabled{opacity:.35;cursor:not-allowed}.view-scale{width:48px;text-align:center;color:#f4f5f7;font-size:11px;font-variant-numeric:tabular-nums}.view-sep{width:1px;height:18px;background:#343940;margin:0 2px}.view-reset{font-size:11px;color:#b9bec5}.loading{position:absolute;inset:0;background:rgba(10,11,13,.72);backdrop-filter:blur(4px);z-index:6;display:none;place-items:center}.loading.show{display:grid}.loader{text-align:center}.spinner{width:32px;height:32px;border:2px solid #343a41;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
    .control-row{display:flex;gap:8px}.icon-btn{height:36px;flex:1;border:1px solid var(--line);border-radius:9px;background:#1b1f23;color:#e8eaed;cursor:pointer}.icon-btn:hover{border-color:#49505a}.icon-btn.active{color:var(--accent);border-color:#607022;background:#20251a}input[type=range]{width:100%;height:4px;accent-color:var(--accent);cursor:pointer}input[type=color]{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer}.switch-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;color:#b9bec5;font-size:12px}.switch{position:relative;width:34px;height:19px}.switch input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;border-radius:99px;background:#30353b;cursor:pointer;transition:.2s}.slider:before{content:"";position:absolute;width:13px;height:13px;left:3px;top:3px;border-radius:50%;background:#9298a1;transition:.2s}.switch input:checked+.slider{background:var(--accent)}.switch input:checked+.slider:before{transform:translateX(15px);background:#111}.status{margin-top:auto;padding:14px 18px;color:var(--muted);font-size:11px;border-top:1px solid var(--line)}.status-line{display:flex;gap:8px;align-items:flex-start}.status-dot{width:7px;height:7px;border-radius:50%;background:#4a5057;margin-top:5px;flex:0 0 auto}.status.ready .status-dot{background:var(--accent);box-shadow:0 0 9px rgba(216,255,69,.5)}.status.error{color:#ff9b9b}.status.error .status-dot{background:var(--danger)}
    .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);padding:10px 14px;background:#25292e;border:1px solid #414750;border-radius:10px;box-shadow:0 12px 40px #0008;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:min(620px,90vw)}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(3,4,5,.72);backdrop-filter:blur(6px)}.modal-backdrop[hidden]{display:none}.dialog{width:min(440px,100%);background:#181b1f;border:1px solid #353a42;border-radius:16px;box-shadow:0 24px 80px #000b;padding:22px}.dialog-head{display:flex;gap:13px;align-items:flex-start}.dialog-icon{width:34px;height:34px;flex:0 0 auto;border-radius:10px;display:grid;place-items:center;background:#352b1b;color:#ffc65c;font-weight:850}.dialog.error .dialog-icon{background:#382022;color:#ff8585}.dialog.info .dialog-icon{background:#24301a;color:var(--accent)}.dialog h3{margin:1px 0 6px;font-size:16px}.dialog-message{margin:0;color:#aeb4bc;font-size:13px;white-space:pre-line}.dialog-detail{max-height:150px;overflow:auto;margin:16px 0 0;padding:10px 12px;border-radius:9px;background:#101214;border:1px solid #292e34;color:#9da4ad;font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:19px}.dialog-actions .btn{min-width:76px}
    @media(max-width:900px){.layout{grid-template-columns:225px 1fr}.rightbar{position:absolute;right:0;top:58px;bottom:0;width:270px;z-index:8;box-shadow:-15px 0 40px #0008;transform:translateX(100%);transition:.25s}.rightbar.open{transform:none}.brand small{display:none}}@media(max-width:650px){.layout{grid-template-columns:1fr}.sidebar{position:absolute;left:0;top:58px;bottom:0;width:260px;z-index:8;box-shadow:15px 0 40px #0008;transform:translateX(-100%);transition:.25s}.sidebar.open{transform:none}.mobile-only{display:inline-block!important}}.mobile-only{display:none}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="mark">S</div><strong>Play Studio Spine</strong><small>本地动画预览工具</small></div>
      <div class="top-actions">
        <button class="btn mobile-only" id="filesToggle">文件</button>
        <button class="btn" id="settingsToggle">参数</button>
        <button class="btn primary" id="openTop">选择文件夹</button>
      </div>
    </header>
    <main class="layout">
      <aside class="sidebar" id="leftbar">
        <section class="section">
          <div class="section-title">资源文件</div>
          <label class="dropzone" id="dropzone">
            <input id="folderInput" type="file" webkitdirectory directory multiple accept=".json,.txt,.skel,.bytes,.atlas,.png,.jpg,.jpeg,.webp" />
            <div class="drop-icon">＋</div><b>选择 Spine 文件夹</b><span class="hint">或把整组文件拖到这里</span>
          </label>
          <div class="file-info" id="fileInfo"><div class="file-name" id="fileName"></div><div class="file-meta" id="fileMeta"></div></div>
          <div class="field" id="skeletonField" hidden><div class="label"><span>骨骼文件</span></div><select class="select" id="skeletonSelect"></select></div>
          <div class="field" id="atlasField" hidden><div class="label"><span>图集文件</span></div><select class="select" id="atlasSelect"></select></div>
        </section>
        <div class="section-title" style="padding:16px 18px 5px;margin:0"><span>动画</span><span class="count" id="animCount">0</span></div>
        <div class="animations" id="animationList"><div class="anim-empty">载入资源后，动画名称会显示在这里</div></div>
        <div class="status" id="status"><div class="status-line"><i class="status-dot"></i><span id="statusText">等待选择文件夹</span></div></div>
      </aside>
      <section class="stage-wrap" id="stage">
        <div class="player-host" id="player"></div>
        <div class="empty-stage" id="emptyStage"><div class="empty-card"><div class="empty-symbol">◇</div><h2>把角色放到舞台上</h2><p>选择包含骨骼、atlas 和贴图的文件夹，即刻在本地预览。</p></div></div>
        <div class="stage-badge"><span class="pill" id="versionBadge">运行时 —</span><span class="pill" id="formatBadge">等待资源</span></div>
        <div class="view-tools" aria-label="视图控制"><button class="view-btn" id="zoomOut" type="button" aria-label="缩小" title="缩小" disabled>−</button><span class="view-scale" id="zoomValue">100%</span><button class="view-btn" id="zoomIn" type="button" aria-label="放大" title="放大" disabled>＋</button><i class="view-sep"></i><button class="view-btn view-reset" id="resetView" type="button" title="恢复大小和位置" disabled>复位</button></div>
        <div class="loading" id="loading"><div class="loader"><div class="spinner"></div><span id="loadingText">正在准备运行时…</span></div></div>
      </section>
      <aside class="sidebar rightbar" id="rightbar">
        <section class="section">
          <div class="section-title">播放</div>
          <div class="control-row"><button class="icon-btn" id="playBtn" disabled>Ⅱ　暂停</button><button class="icon-btn" id="restartBtn" disabled>↺　重播</button></div>
          <div class="field"><div class="label"><span>播放速度</span><output id="speedValue">1.00×</output></div><input id="speed" type="range" min="0.1" max="3" value="1" step="0.05"></div>
          <div class="field"><div class="label"><span>混合时间</span><output id="mixValue">0.20s</output></div><input id="mix" type="range" min="0" max="1" value="0.2" step="0.05"></div>
          <div class="switch-row"><span>循环播放</span><label class="switch"><input id="loop" type="checkbox" checked><span class="slider"></span></label></div>
        </section>
        <section class="section">
          <div class="section-title">画面</div>
          <div class="switch-row"><span>透明背景</span><label class="switch"><input id="transparent" type="checkbox" checked><span class="slider"></span></label></div>
          <div class="switch-row"><span>背景颜色</span><input id="bgColor" type="color" value="#16191d" disabled></div>
          <div class="switch-row"><span>预乘 Alpha</span><label class="switch"><input id="pma" type="checkbox" checked><span class="slider"></span></label></div>
          <div class="switch-row"><span>显示骨骼</span><label class="switch"><input id="bones" type="checkbox"><span class="slider"></span></label></div>
          <button class="btn" id="applyVisual" style="width:100%;margin-top:10px" disabled>应用画面设置</button>
        </section>
        <section class="section">
          <div class="section-title">兼容性</div>
          <div class="field"><div class="label"><span>Spine 运行时</span></div><select class="select" id="runtime"><option value="auto">自动识别（推荐）</option><option value="4.3">Spine 4.3</option><option value="4.2">Spine 4.2</option><option value="4.1">Spine 4.1</option><option value="4.0">Spine 4.0</option><option value="3.8">Spine 3.8</option></select></div>
          <p class="hint">运行时需要联网从官方 npm CDN 加载；选择的动画文件始终只在本机浏览器中处理。</p>
        </section>
      </aside>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-backdrop" id="dialogBackdrop" hidden><div class="dialog warning" id="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogMessage"><div class="dialog-head"><div class="dialog-icon" id="dialogIcon">!</div><div><h3 id="dialogTitle">提示</h3><p class="dialog-message" id="dialogMessage"></p></div></div><pre class="dialog-detail" id="dialogDetail" hidden></pre><div class="dialog-actions"><button class="btn" id="dialogCancel" type="button" hidden>取消</button><button class="btn primary" id="dialogConfirm" type="button">知道了</button></div></div></div>
  <script>
    (()=>{
      const $=id=>document.getElementById(id); const state={files:[],player:null,animation:'',paused:false,version:'4.3',urls:[],loadToken:0,lastAttempt:null,view:{zoom:1,x:0,y:0,dragging:false,startX:0,startY:0,originX:0,originY:0}};let dialogResolve=null;
      const runtimeUrls=v=>v==='3.8'?{js:'https://cdn.jsdelivr.net/gh/EsotericSoftware/spine-runtimes@3.8/spine-ts/build/spine-player.js',css:'https://cdn.jsdelivr.net/gh/EsotericSoftware/spine-runtimes@3.8/spine-ts/player/css/spine-player.css'}:{js:`https://unpkg.com/@esotericsoftware/spine-player@${v}.*/dist/iife/spine-player.min.js`,css:`https://unpkg.com/@esotericsoftware/spine-player@${v}.*/dist/spine-player.min.css`};
      function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),3500)}
      function closeDialog(result){$('dialogBackdrop').hidden=true;const resolve=dialogResolve;dialogResolve=null;resolve?.(result)}
      function showDialog({title='提示',message='',detail='',type='warning',confirmText='知道了',cancelText=''}){if(dialogResolve)closeDialog(false);$('dialog').className='dialog '+type;$('dialogIcon').textContent=type==='error'?'!':type==='info'?'i':'△';$('dialogTitle').textContent=title;$('dialogMessage').textContent=message;$('dialogDetail').textContent=detail;$('dialogDetail').hidden=!detail;$('dialogConfirm').textContent=confirmText;$('dialogCancel').textContent=cancelText||'取消';$('dialogCancel').hidden=!cancelText;$('dialogBackdrop').hidden=false;setTimeout(()=>$('dialogConfirm').focus(),0);return new Promise(resolve=>dialogResolve=resolve)}
      function status(msg,type=''){$('statusText').textContent=msg;$('status').className='status '+type}
      function setLoading(on,msg='正在载入动画…'){$('loadingText').textContent=msg;$('loading').classList.toggle('show',on)}
      function basename(path){return path.replace(/\\/g,'/').split('/').pop()}
      function isJsonFile(name){return /\.json(?:\.txt)?$/i.test(name)}
      function isAtlasFile(name){return /\.atlas(?:\.txt)?$/i.test(name)}
      function isSkeletonFile(name){return isJsonFile(name)||/\.(?:skel|bytes)$/i.test(name)}
      function stem(name){return basename(name).replace(/\.(?:json|atlas)\.txt$/i,'').replace(/\.(json|skel|bytes|atlas)$/i,'').replace(/(?:-pro|-ess|-pma)$/i,'')}
      function standardSkeletonKey(path,json){return json?path.replace(/\.json\.txt$/i,'.json'):path.replace(/(?:\.skel)?\.bytes$/i,'.skel')}
      function standardAtlasKey(path){return path.replace(/\.atlas\.txt$/i,'.atlas')}
      function fileToDataURI(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error(`无法读取本地文件：${file.name}`));reader.readAsDataURL(file)})}
      async function atlasTextureNames(file){try{return (await file.text()).split(/\r?\n/).map(x=>x.trim()).filter(x=>/\.(png|jpe?g|webp)$/i.test(x))}catch(e){return []}}
      function filePath(f){return (f._spineRelativePath||f.webkitRelativePath||f.name).replace(/\\/g,'/')}
      function attachRelativePath(file,path){try{Object.defineProperty(file,'_spineRelativePath',{value:path.replace(/^\//,''),configurable:true})}catch(e){file._spineRelativePath=path.replace(/^\//,'')}return file}
      function entryFile(entry){return new Promise((resolve,reject)=>entry.file(file=>{try{Object.defineProperty(file,'_spineRelativePath',{value:entry.fullPath.replace(/^\//,''),configurable:true})}catch(e){file._spineRelativePath=entry.fullPath.replace(/^\//,'')}resolve(file)},reject))}
      async function walkEntry(entry){if(entry.isFile)return [await entryFile(entry)];if(!entry.isDirectory)return [];const reader=entry.createReader(),children=[];while(true){const batch=await new Promise((resolve,reject)=>reader.readEntries(resolve,reject));if(!batch.length)break;children.push(...batch)}const nested=await Promise.all(children.map(walkEntry));return nested.flat()}
      async function walkHandle(handle,parent=''){const path=parent?`${parent}/${handle.name}`:handle.name;if(handle.kind==='file')return [attachRelativePath(await handle.getFile(),path)];if(handle.kind!=='directory')return [];const files=[];for await(const child of handle.values())files.push(...await walkHandle(child,path));return files}
      async function filesFromDrop(dataTransfer){const items=[...(dataTransfer.items||[])];const handleTasks=items.map(item=>item.getAsFileSystemHandle?.()).filter(Boolean);if(handleTasks.length){try{const handles=(await Promise.all(handleTasks)).filter(Boolean),groups=await Promise.all(handles.map(handle=>walkHandle(handle)));const files=groups.flat();if(files.length)return files}catch(e){console.warn('File System Access fallback:',e)}}const entries=items.map(item=>item.webkitGetAsEntry?.()).filter(Boolean);if(entries.length){try{const groups=await Promise.all(entries.map(walkEntry)),files=groups.flat();if(files.length)return files}catch(e){console.warn('File Entry fallback:',e)}}return [...dataTransfer.files]}
      function detectVersion(file){return new Promise(resolve=>{const reader=new FileReader();reader.onload=()=>{try{let text;if(isJsonFile(file.name)){const data=JSON.parse(reader.result);text=(data.skeleton&&data.skeleton.spine)||''}else{text=new TextDecoder('utf-8',{fatal:false}).decode(reader.result)}const m=String(text).match(/(?:^|[^\d])([34]\.[0-9]+(?:\.[0-9]+)?)/);resolve(m?m[1]:'')}catch(e){resolve('')}};reader.onerror=()=>resolve('');if(isJsonFile(file.name))reader.readAsText(file);else reader.readAsArrayBuffer(file.slice(0,512))})}
      function fillSelect(el,files){el.innerHTML='';files.forEach((f,i)=>{const o=document.createElement('option');o.value=String(state.files.indexOf(f));o.textContent=filePath(f);el.appendChild(o)})}
      function closestAtlas(skeleton,atlases){if(!atlases.length)return null;const s=stem(skeleton.name).toLowerCase();return atlases.find(a=>stem(a.name).toLowerCase()===s)||atlases.find(a=>stem(a.name).toLowerCase().includes(s)||s.includes(stem(a.name).toLowerCase()))||atlases[0]}
      async function receiveFiles(list){const supplied=[...list],files=supplied.filter(f=>isSkeletonFile(f.name)||isAtlasFile(f.name)||/\.(png|jpe?g|webp)$/i.test(f.name)),skeletons=files.filter(f=>isSkeletonFile(f.name)),atlases=files.filter(f=>isAtlasFile(f.name)),textures=files.filter(f=>/\.(png|jpe?g|webp)$/i.test(f.name));const missing=[];if(!skeletons.length)missing.push('骨骼文件（.json / .json.txt / .skel / .bytes）');if(!atlases.length)missing.push('Atlas 文件（.atlas / .atlas.txt）');if(!textures.length)missing.push('贴图文件（.png / .jpg / .webp）');if(missing.length){await showDialog({title:'无法开始解析',message:'选择的目录缺少必要资源，Spine Player 无法启动解析。',detail:'缺少：\n• '+missing.join('\n• ')+`\n\n本次读取到 ${supplied.length} 个文件，识别到 ${files.length} 个 Spine 资源。`,type:'error'});return}const atlas=closestAtlas(skeletons[0],atlases),refs=await atlasTextureNames(atlas),textureNames=new Set(textures.flatMap(f=>[filePath(f).toLowerCase(),basename(filePath(f)).toLowerCase()])),missingTextures=refs.filter(name=>!textureNames.has(name.toLowerCase())&&!textureNames.has(basename(name).toLowerCase()));if(missingTextures.length){await showDialog({title:'无法开始解析',message:'Atlas 引用的贴图未包含在所选资源中。',detail:'缺少贴图：\n• '+missingTextures.join('\n• '),type:'error'});return}state.files=files;state.lastAttempt=null;resetViewport();fillSelect($('skeletonSelect'),skeletons);fillSelect($('atlasSelect'),atlases);$('skeletonField').hidden=skeletons.length<2;$('atlasField').hidden=atlases.length<2;$('atlasSelect').value=String(files.indexOf(atlas));const root=filePath(files[0]).split('/')[0]||'已选文件夹';$('fileName').textContent=root;$('fileMeta').textContent=`${files.length} 个资源 · ${skeletons.length} 个骨骼文件`;$('fileInfo').classList.add('show');await loadCurrent()}
      function cleanupPlayer(){if(state.player){try{state.player.dispose&&state.player.dispose()}catch(e){}}state.player=null;$('player').innerHTML='';$('stage').classList.remove('view-ready','panning');document.querySelectorAll('.view-btn').forEach(b=>b.disabled=true);state.urls.forEach(URL.revokeObjectURL);state.urls=[]}
      async function loadRuntime(version){if(document.documentElement.dataset.spineRuntime===version&&window.spine?.SpinePlayer)return;try{window.spine=undefined}catch(e){}document.querySelectorAll('[data-spine-asset]').forEach(n=>n.remove());const u=runtimeUrls(version);await new Promise((resolve,reject)=>{const css=document.createElement('link');css.rel='stylesheet';css.href=u.css;css.dataset.spineAsset='';document.head.appendChild(css);const s=document.createElement('script');s.src=u.js;s.dataset.spineAsset='';s.onload=()=>window.spine?.SpinePlayer?resolve():reject(new Error(`Spine ${version} 运行时初始化失败`));s.onerror=()=>reject(new Error('运行时下载失败，请检查网络连接'));document.head.appendChild(s)});document.documentElement.dataset.spineRuntime=version}
      async function loadCurrent(){if(!state.files.length)return;const skeleton=state.files[+$('skeletonSelect').value];const atlas=state.files[+$('atlasSelect').value];if(!skeleton||!atlas)return;const token=++state.loadToken;setLoading(true,'正在识别文件版本…');status('正在读取本地资源');cleanupPlayer();const detected=await detectVersion(skeleton),chosen=$('runtime').value,version=chosen==='auto'?(detected.match(/^(?:3\.8|4\.[0-3])/)?.[0]||(detected.startsWith('3.')?'3.8':'4.3')):chosen;if(token!==state.loadToken)return;state.version=version;state.lastAttempt={detected:detected||'未识别',version,skeleton:filePath(skeleton),atlas:filePath(atlas)};const isJson=isJsonFile(skeleton.name);$('versionBadge').textContent=`运行时 ${version}${detected?' · 导出 '+detected:''}`;$('formatBadge').textContent=isJson?'JSON':'BINARY / BYTES';try{setLoading(true,`正在加载 Spine ${version} 运行时…`);await loadRuntime(version);if(token!==state.loadToken)return;setLoading(true,'正在将本地资源载入内存…');const encoded=await Promise.all(state.files.map(async f=>[f,await fileToDataURI(f)]));if(token!==state.loadToken)return;const raw={};encoded.forEach(([f,data])=>{const path=filePath(f),base=basename(path);raw[path]=data;raw[base]=data});const skeletonKey=standardSkeletonKey(filePath(skeleton),isJson),atlasKey=standardAtlasKey(filePath(atlas));raw[skeletonKey]=raw[filePath(skeleton)];raw[basename(skeletonKey)]=raw[filePath(skeleton)];raw[atlasKey]=raw[filePath(atlas)];raw[basename(atlasKey)]=raw[filePath(atlas)];setLoading(true,'正在解析骨骼与贴图…');const config={rawDataURIs:raw,showControls:false,showLoading:false,interactive:false,alpha:true,preserveDrawingBuffer:false,backgroundColor:currentBg(),premultipliedAlpha:$('pma').checked,defaultMix:+$('mix').value,debug:{bones:$('bones').checked,regions:false,meshes:false,bounds:false,paths:false,clipping:false,points:false,hulls:false},success:onPlayerReady,error:(p,reason)=>onPlayerError(reason)};if(version==='3.8'){config[isJson?'jsonUrl':'skelUrl']=skeletonKey;config.atlasUrl=atlasKey}       function onPlayerReady(player){state.player=player;player.speed=+$('speed').value;const animations=player.skeleton?.data?.animations||[];renderAnimations(animations.map(a=>a.name));state.animation=animations[0]?.name||'';if(state.animation)player.setAnimation(state.animation,$('loop').checked);setLoading(false);$('emptyStage').style.display='none';$('playBtn').disabled=$('restartBtn').disabled=$('applyVisual').disabled=false;document.querySelectorAll('.view-btn').forEach(b=>b.disabled=false);$('stage').classList.add('view-ready');status(`已就绪 · ${animations.length} 个动画`,'ready');$('versionBadge').classList.add('ok')}
      function onPlayerError(reason){setLoading(false);$('emptyStage').style.display='grid';$('animationList').innerHTML='<div class="anim-empty">动画载入失败<br>请查看弹窗中的可能原因</div>';const text=typeof reason==='string'?reason:(()=>{try{return JSON.stringify(reason,null,2)}catch(e){return String(reason)}})(),a=state.lastAttempt||{},diagnosis=['可能原因：','• 骨骼、Atlas 或贴图文件缺失','• Atlas 引用的贴图名称或目录不正确',`• 导出版本（${a.detected||'未知'}）与运行时（${a.version||'未知'}）不兼容`,'• 骨骼、Atlas 和贴图不是同一次导出','• 文件损坏，或运行时下载失败','','本次尝试：',`骨骼：${a.skeleton||'未知'}`,`Atlas：${a.atlas||'未知'}`,`运行时：Spine ${a.version||'未知'}`,'','原始错误：',text].join('\n');status('解析失败：'+text.replace(/^Error:\s*/,''),'error');showDialog({title:'Spine 解析失败',message:'运行时未能解析当前资源。请根据以下可能原因逐项检查。',detail:diagnosis,type:'error'})}
      function renderAnimations(names){$('animCount').textContent=names.length;$('animationList').innerHTML='';if(!names.length){$('animationList').innerHTML='<div class="anim-empty">这个文件没有动画</div>';return}names.forEach((name,i)=>{const b=document.createElement('button');b.className='anim-btn'+(i===0?' active':'');b.innerHTML='<span class="play-dot">▶</span><span class="anim-name"></span>';b.querySelector('.anim-name').textContent=name;b.onclick=()=>playAnimation(name,b);$('animationList').appendChild(b)})}
      function playAnimation(name,button){if(!state.player)return;state.animation=name;state.paused=false;state.player.paused=false;state.player.setAnimation(name,$('loop').checked);$('playBtn').textContent='Ⅱ　暂停';document.querySelectorAll('.anim-btn').forEach(x=>x.classList.remove('active'));button?.classList.add('active')}
      function currentBg(){return $('transparent').checked?'#00000000':$('bgColor').value+'ff'}
      function applyViewport(){const v=state.view;$('player').style.transform=`translate3d(${v.x}px,${v.y}px,0) scale(${v.zoom})`;$('zoomValue').textContent=Math.round(v.zoom*100)+'%';$('zoomOut').disabled=!state.player||v.zoom<=.25;$('zoomIn').disabled=!state.player||v.zoom>=4}

      $('dialogConfirm').onclick=()=>closeDialog(true);$('dialogCancel').onclick=()=>closeDialog(false);$('dialogBackdrop').onclick=e=>{if(e.target===$('dialogBackdrop')&&!$('dialogCancel').hidden)closeDialog(false)};$('folderInput').onchange=e=>receiveFiles(e.target.files);$('openTop').onclick=()=>$('folderInput').click();$('skeletonSelect').onchange=()=>{const sk=state.files[+$('skeletonSelect').value],ats=state.files.filter(f=>isAtlasFile(f.name)),a=closestAtlas(sk,ats);if(a)$('atlasSelect').value=String(state.files.indexOf(a));loadCurrent()};$('atlasSelect').onchange=loadCurrent;$('runtime').onchange=loadCurrent;
      $('playBtn').onclick=()=>{if(!state.player)return;state.paused=!state.paused;state.player.paused=state.paused;$('playBtn').textContent=state.paused?'▶　播放':'Ⅱ　暂停'};$('restartBtn').onclick=()=>playAnimation(state.animation,document.querySelector('.anim-btn.active'));
      $('speed').oninput=e=>{$('speedValue').textContent=(+e.target.value).toFixed(2)+'×';if(state.player)state.player.speed=+e.target.value};$('mix').oninput=e=>$('mixValue').textContent=(+e.target.value).toFixed(2)+'s';$('loop').onchange=()=>state.animation&&playAnimation(state.animation,document.querySelector('.anim-btn.active'));$('applyVisual').onclick=loadCurrent;
      $('transparent').onchange=()=>{$('bgColor').disabled=$('transparent').checked};$('settingsToggle').onclick=()=>$('rightbar').classList.toggle('open');$('filesToggle').onclick=()=>$('leftbar').classList.toggle('open');
      const dz=$('dropzone');['dragenter','dragover'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.add('drag')}));['dragleave','drop'].forEach(t=>dz.addEventListener(t,e=>{e.preventDefault();dz.classList.remove('drag')}));dz.addEventListener('drop',async e=>{try{setLoading(true,'正在读取拖入的文件夹…');const files=await filesFromDrop(e.dataTransfer);setLoading(false);if(!files.length){toast('浏览器限制了目录拖放，已打开文件夹选择器');$('folderInput').click();return}await receiveFiles(files)}catch(err){setLoading(false);toast('目录拖放受限，已打开文件夹选择器');$('folderInput').click()}});
      const stage=$('stage');$('zoomOut').onclick=()=>setViewportZoom(state.view.zoom/1.2);$('zoomIn').onclick=()=>setViewportZoom(state.view.zoom*1.2);$('resetView').onclick=resetViewport;stage.addEventListener('wheel',e=>{if(!state.player||e.target.closest('.view-tools'))return;e.preventDefault();setViewportZoom(state.view.zoom*Math.exp(-e.deltaY*.0015))},{passive:false});stage.addEventListener('pointerdown',e=>{if(!state.player||e.button!==0||e.target.closest('.view-tools')||e.target.closest('.stage-badge'))return;Object.assign(state.view,{dragging:true,startX:e.clientX,startY:e.clientY,originX:state.view.x,originY:state.view.y});stage.classList.add('panning');stage.setPointerCapture?.(e.pointerId);e.preventDefault()},true);stage.addEventListener('pointermove',e=>{if(!state.view.dragging)return;state.view.x=state.view.originX+e.clientX-state.view.startX;state.view.y=state.view.originY+e.clientY-state.view.startY;applyViewport()});const endPan=e=>{if(!state.view.dragging)return;state.view.dragging=false;stage.classList.remove('panning');try{stage.releasePointerCapture?.(e.pointerId)}catch(err){}};stage.addEventListener('pointerup',endPan);stage.addEventListener('pointercancel',endPan);stage.addEventListener('lostpointercapture',endPan);
      window.addEventListener('keydown',e=>{if(!$('dialogBackdrop').hidden&&e.key==='Escape'){closeDialog(false);return}if(!state.player||/INPUT|SELECT|BUTTON/.test(document.activeElement.tagName))return;if(e.code==='Space'){e.preventDefault();$('playBtn').click()}if(e.key.toLowerCase()==='r')$('restartBtn').click();if(e.key==='0')resetViewport();if(e.key==='+'||e.key==='=')setViewportZoom(state.view.zoom*1.2);if(e.key==='-')setViewportZoom(state.view.zoom/1.2)});
